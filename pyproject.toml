[project]
name = "postgres-projekt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "etalom", email = "emmanueltalomqyahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.1.4",
    "streamlit>=1.66.0",
    "streamlit-autorefresh>=1.0.1",
]

[project.scripts]
postgres-projekt = "postgres_projekt:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
